services:
  app:
    build: .
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://perfnest:perfnest@db:5432/perfnest
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in your .env file}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in your .env file}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: perfnest
      POSTGRES_PASSWORD: perfnest
      POSTGRES_DB: perfnest
    volumes:
      - perfnest_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfnest"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  perfnest_db:
