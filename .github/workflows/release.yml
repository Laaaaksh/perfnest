name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

# A release run must never be cancelled mid-publish (a half-pushed image
# tag is worse than a queued one), so overlapping runs queue instead of
# cancelling.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generate release notes from CHANGELOG
        id: notes
        run: scripts/release_notes.sh "$RUNNER_TEMP/release-notes.md" "${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
